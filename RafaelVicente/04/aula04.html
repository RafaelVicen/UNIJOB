<!DOCTYPE html>

<head>

    <title>Document</title>

<body>
    <h4>Formulario</h4>
    <fieldset>
        <legend>Cadastro de utilizador</legend>
        <!--Com o from criamos o nosso formulario dentro de uma div-->
        <form action="">
            <div>
                <label for="nome">nome:</label>
                <input type="text" name="" id="" placeholder="Digite o seu nome" required>
            </div>
            <br>
            <div>
                <label for="email">email:</label>
                <input type="email" name="" id="" placeholder="Digite seu email" required>
            </div>
            <br>
            <div>
                <label for="senha">senha:</label>
                <input type="password" name="" id="" placeholder="Digite uma senha" maxlength="12" minlength="8"
                    required>
            </div>
            <br>
            <div>
                <label for="data_nasc">Data de Nascimento:</label>
                <input type="date" name="" required>
            </div>
            <br>
            <div>
                Genero:
                <select name="genero" id="">
                    <option value="disabled">Escolhe uma opcao</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Binario">Binario</option>
                    <option value="NaoBinario">NaoBinario</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <br>
            <input type="submit" value="enviar">
            <input type="reset" value="Limpar">
        </form>
    </fieldset>
    <h3>Tabelas</h3>
    <table border="2">
